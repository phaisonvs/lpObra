<template>
    <div class="obra-top-header">
        <div class="obra-full-container-menu">
            <div class="obra-content-menu">
                <div class="obra-menu-logo-wrap">
                    <a
                        href="#"
                        class="obra-menu-logo-link"
                        onclick={handleLogoClick}
                        aria-label="ABC da Construção — início"
                    >
                        <img
                        src={companyLogoURL}
                        alt="ABC da Construção"
                        class="obra-menu-logo-img"
                        loading="eager"
                        />
                    </a>
                </div>

                <div class="obra-menu-cta-slot">
                    <a class="obra-menu-cta-btn" href="#" onclick={handleHeaderCtaClick}>
                        Cadastrar obra
                    </a>
                </div>
            </div>
        </div>
    </div>

    <section class="hero-section" data-lp-section="hero" data-id="hero-section">
        <div class="hero-background">
            <img
            class="hero-background__img"
            src={urlHeroBackground}
            alt=""
            aria-hidden="true"
            loading="eager"
            decoding="async"
            />
        </div>

        <div class="hero-container">
            <div class="hero-content">
                <div class="logo-container">
                    <img
                        src={companyLogoURL}
                        alt="Logo ABC da Construção"
                        class="logo-abc"
                        loading="eager"
                    />
                </div>

                <div class="hero-text">
                    <p class="subtitulo">
                        Você está construindo<br /> ou reformando?
                    </p>
                    <h1 class="titulo-principal">
                        Cadastre sua obra<br />
                        e ative seu Status <span class="hero-accent">VIP</span>
                    </h1>
                </div>

                <div class="big-numbers" lwc:ref="bigNumbers">
                    <ul>
                        <template for:each={bigNumbersData} for:item="item">
                        <li key={item.id}>
                            <div>
                            <img class="big-numbers__icon" src={item.iconSrc}>
                            </div>
                            <div class="big-numbers__info">
                            <span class="number" data-original-value={item.value}>{item.displayValue}</span>
                            <span>{item.description}</span>
                            </div>
                        </li>
                        </template>
                    </ul>
                </div>

                <div class="cta-container">
                    <button class="cta-button" onclick={handleCtaClick}>
                        <span class="cta-text">
                        Cadastrar obra
                        </span>
                    </button>
                    <p class="disclaimer">*Consulte condições</p>
                </div>
            </div>
        </div>

        <button
            type="button"
            class="hero-scroll-hint"
            data-scroll-target="beneficios"
            onclick={handleScrollHintClick}
            aria-label="Ir para benefícios"
        >
            <svg
                class="hero-scroll-hint__icon"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <path
                    d="M7 10l5 5 5-5"
                    stroke="currentColor"
                    stroke-width="1.85"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </button>
    </section>

    <section
        class="obra-beneficios"
        style={beneficiosBackgroundStyle}
        data-lp-section="beneficios"
        aria-labelledby="obra-beneficios-titulo"
    >

        <div class="obra-beneficios__inner">
            <header class="obra-beneficios__cabecalho">
                <div class="obra-beneficios__divisor" aria-hidden="true"></div>
                <span class="obra-beneficios__coroa" aria-hidden="true">
                    <svg
                        class="obra-beneficios__coroa-icon"
                        viewBox="0 0 14 14"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="currentColor"
                    >
                        <path id="Vector" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" 
                            d="m13.5 4 -3 3L7 2 3.5 7l-3 -3v6.5c0 0.3978 0.158035 0.7794 0.43934 1.0607C1.22064 
                            11.842 1.60218 12 2 12h10c0.3978 0 0.7794 -0.158 1.0607 -0.4393S13.5 10.8978 13.5 
                            10.5V4Z" stroke-width="2"></path>
                    </svg>
                </span>
                <div class="obra-beneficios__divisor" aria-hidden="true"></div>
            </header>

            <h2 id="obra-beneficios-titulo" class="obra-beneficios__titulo">
                Quais benefícios exclusivos <br />você conquista com seu Status VIP?
            </h2>

            <div class="obra-beneficios__grade">
                <article class="obra-beneficios__card">
                    <div class="obra-beneficios__icone" aria-hidden="true">
                        <img src={urlCardLoja} alt="" />
                    </div>
                    <div class="obra-beneficios__corpo">
                        <p class="obra-beneficios__texto">
                            Poder de compra da <strong class="obra-beneficios__destaque">Maior Rede</strong> de acabamentos do país
                        </p>
                    </div>
                </article>

                <article class="obra-beneficios__card">
                    <div class="obra-beneficios__icone" aria-hidden="true">
                        <img src={urlCardObra} alt="" />
                    </div>
                    <div class="obra-beneficios__corpo">
                        <p class="obra-beneficios__texto">
                            Preços <strong class="obra-beneficios__destaque">imbatíveis</strong> em produtos de início de obra
                        </p>
                    </div>
                </article>

                <article class="obra-beneficios__card">
                    <div class="obra-beneficios__icone" aria-hidden="true">
                        <img src={urlCardArgamassa} alt="" />
                    </div>
                    <div class="obra-beneficios__corpo">
                        <p class="obra-beneficios__texto">
                            Argamassa <strong class="obra-beneficios__destaque">Grátis</strong> para cada 5m² de porcelanatos
                        </p>
                    </div>
                </article>

                <article class="obra-beneficios__card">
                    <div class="obra-beneficios__icone" aria-hidden="true">
                        <img src={urlCardPrime} alt="" />
                    </div>
                    <div class="obra-beneficios__corpo">
                        <p class="obra-beneficios__texto">
                            <strong class="obra-beneficios__destaque"><nobr>R$ 1.200</nobr></strong> em assinatura do 
                            <nobr> ABC Prime</nobr>: +3 mil itens a preço de custo para sua casa.
                        </p>
                    </div>
                </article>

        </div>

            <div class="obra-beneficios__acao">
                <a
                    class="obra-beneficios__cta"
                    href="#"
                    onclick={handleBeneficiosCtaClick}
                >
                    Cadastrar obra
                </a>
                
            </div>
            <div class="obra-beneficios__disclaimer">
                <p class="disclaimer">*Consulte condições</p>
            </div>
        </div>
    </section>
</template>
