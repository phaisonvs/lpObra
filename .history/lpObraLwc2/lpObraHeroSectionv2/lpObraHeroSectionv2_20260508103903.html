<template>
  <section class="hero-section" data-id="hero-section">
    <div class="hero-background" style={heroBgStyle}></div>

    <div class="hero-container">
      <div class="hero-content">
        <div class="logo-container">
          <img
            src={companyLogoURL}
            alt="Logo ABC da Construção"
            class="logo-abc"
            loading="eager"
          />
        </div>

        <div class="hero-text">
          <p class="subtitulo">
            ABRIR UMA LOJA DE ACABAMENTOS<br />
            PODE CUSTAR <strong>ATÉ R$ 2 MILHÕES,</strong>
          </p>
          <h1 class="titulo-principal">
            MAS COM A ABC É UMA FRAÇÃO DESSE VALOR!
          </h1>
        </div>

        <div class="cta-container">
          <button class="cta-button" onclick={handleCtaClick}>
            <span class="cta-text">
              MODELOS A PARTIR DE R$ 50.000!*<br />CLIQUE E SAIBA COMO
            </span>
          </button>
          <p class="disclaimer">*Consulte condições</p>
        </div>
      </div>
    </div>
  </section>
