<template>
  <section class="hero-section lp-block lp-hero hero-root" data-lp-section="hero" aria-label="Cadastro de orçamento">
    <header class="lp-fixed-header">
      <div class="lp-fixed-header__inner">
        <a class="lp-fixed-header__brand" href="#" onclick={handleScrollHero} aria-label="ABC da construção">
          <img class="lp-fixed-header__logo" src={logoUrl} alt="ABC da construção">
        </a>

        <button type="button" class="lp-fixed-header__menu-btn" aria-expanded={drawerExpanded}
          aria-haspopup="true" aria-label={menuBtnLabel} onclick={toggleDrawer}>
          <span class="lp-fixed-header__menu-bar" aria-hidden="true"></span>
          <span class="lp-fixed-header__menu-bar" aria-hidden="true"></span>
          <span class="lp-fixed-header__menu-bar" aria-hidden="true"></span>
        </button>

        <nav class="lp-fixed-header__nav" aria-label="Menu da página">
          <button class="lp-fixed-header__link" type="button" data-scroll-target="beneficios" onclick={handleNavScroll}>Benefícios</button>
          <button class="lp-fixed-header__link" type="button">Como funciona</button>
          <button class="lp-fixed-header__link" type="button" data-scroll-target="faq" onclick={handleNavScroll}>Dúvidas</button>
        </nav>

        <div class="lp-fixed-header__trailing">
          <a class="lp-fixed-header__cta lp-cta-premium" href="#" data-scroll-target="form" onclick={handleNavScroll}>
            Quero cadastrar meu orçamento
          </a>
        </div>
      </div>

      <div class="lp-fixed-header__drawer" hidden={drawerHidden}>
        <nav class="lp-fixed-header__drawer-nav" aria-label="Menu principal">
          <button type="button" class="lp-fixed-header__drawer-link" data-scroll-target="beneficios" onclick={handleDrawerLink}>Benefícios</button>
          <button type="button" class="lp-fixed-header__drawer-link">Como funciona</button>
          <button type="button" class="lp-fixed-header__drawer-link" data-scroll-target="faq" onclick={handleDrawerLink}>Dúvidas</button>
          <a class="lp-fixed-header__drawer-cta lp-cta-premium" href="#" data-scroll-target="form" onclick={handleDrawerLink}>
            Quero cadastrar meu orçamento
          </a>
        </nav>
      </div>
    </header>

    <div class="lp-hero__media" aria-hidden="true" style={heroMediaStyle}></div>
    <span class="lp-hero__vip-flare lp-hero__vip-flare--main" aria-hidden="true"></span>

    <div class="lp-hero__inner">
      <div class="lp-hero__content">
        <h1 class="lp-hero__title">
          Cadastre seu orçamento
          <span class="hero-accent"> na maior do Brasil </span>
          e se torne
          <span class="lp-hero__vip">
            <span class="lp-hero__vip-streak lp-hero__vip-streak--a" aria-hidden="true"></span>
            <span class="lp-hero__vip-streak lp-hero__vip-streak--b" aria-hidden="true"></span>
            <span class="lp-hero__vip-spark lp-hero__vip-spark--1" aria-hidden="true"></span>
            <span class="lp-hero__vip-spark lp-hero__vip-spark--2" aria-hidden="true"></span>
            <span class="lp-hero__vip-spark lp-hero__vip-spark--3" aria-hidden="true"></span>
            <span class="lp-hero__vip-label">CLIENTE VIP</span>
          </span>
        </h1>

        <div class="lp-hero__stats" aria-label="Destaques da marca">
          <article class="lp-hero__stat">
            <div class="lp-hero__stat-icon" aria-hidden="true">
              <img class="lp-hero__stat-icon-img" src={urlHeroStatIconMaiorRede} alt="">
            </div>
            <strong>Maior rede</strong>
            <span>especialista em acabamentos do Brasil</span>
          </article>
          <article class="lp-hero__stat">
            <div class="lp-hero__stat-icon" aria-hidden="true">
              <img class="lp-hero__stat-icon-img" src={urlHeroStatIconFranquias} alt="">
            </div>
            <strong>+400</strong>
            <span>franquias</span>
          </article>
          <article class="lp-hero__stat">
            <div class="lp-hero__stat-icon" aria-hidden="true">
              <img class="lp-hero__stat-icon-img" src={urlHeroStatIconEstados} alt="">
            </div>
            <strong>11</strong>
            <span>estados do país</span>
          </article>
          <article class="lp-hero__stat">
            <div class="lp-hero__stat-icon" aria-hidden="true">
              <img class="lp-hero__stat-icon-img" src={urlHeroStatIconAnos} alt="">
            </div>
            <strong>+68 anos</strong>
            <span>de tradição</span>
          </article>
        </div>

        <div class="lp-hero__actions">
          <a class="lp-hero__cta lp-cta-premium" href="#" data-scroll-target="form" onclick={handleNavScroll}>
            Quero cadastrar meu orçamento
          </a>
        </div>
      </div>
    </div>

    <button type="button" class="lp-hero__scroll-hint" data-scroll-target="form" onclick={handleNavScroll}
      aria-label="Continuar para o cadastro">
      <svg class="lp-hero__scroll-hint-icon" width="28" height="28" viewBox="0 0 24 24" fill="none"
        xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
  </section>

  <section class="beneficios lp-block lp-beneficios-vip" data-lp-section="beneficios"
    aria-labelledby="lp-beneficios-vip-titulo">
    <div class="beneficios-vip-fundo-midia" aria-hidden="true" style={beneficiosMediaStyle}></div>
    <div class="beneficios-vip-conteudo">
      <header class="beneficios-vip-cabecalho">
        <div class="beneficios-vip-divisor" aria-hidden="true"></div>
        <span class="beneficios-vip-coroa" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 18h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="m4 18 1.5-9 5 4 2.5-7 2.5 7 5-4L20 18" stroke="currentColor" stroke-width="1.6"
              stroke-linejoin="round" />
            <circle cx="6" cy="8.5" r="1.2" fill="currentColor" />
            <circle cx="12.9" cy="4.7" r="1.2" fill="currentColor" />
            <circle cx="18.1" cy="8.4" r="1.2" fill="currentColor" />
          </svg>
        </span>
        <div class="beneficios-vip-divisor" aria-hidden="true"></div>
      </header>

      <h2 id="lp-beneficios-vip-titulo" class="beneficios-vip-titulo">Benefícios Exclusivos</h2>

      <div class="beneficios-vip-grade">
        <article class="beneficios-vip-card">
          <figure class="beneficios-vip-icone">
            <img src={urlIcone1} alt="Poder de compra da maior rede">
          </figure>
          <p class="beneficios-vip-texto">
            Poder de compra<wbr> da
            <strong class="beneficios-vip-texto-destaque">Maior Rede</strong><wbr>
            de acabamentos<wbr> do país
          </p>
        </article>

        <article class="beneficios-vip-card">
          <figure class="beneficios-vip-icone">
            <img src={urlIcone2} alt="Argamassa grátis">
          </figure>
          <p class="beneficios-vip-texto">
            Argamassa<wbr>
            <strong class="beneficios-vip-texto-destaque">Grátis</strong><wbr>
            para cada<wbr> 5m² de<wbr> porcelanatos
          </p>
        </article>

        <article class="beneficios-vip-card">
          <figure class="beneficios-vip-icone">
            <img src={urlIcone3} alt="Cashback do ABC Prime">
          </figure>
          <p class="beneficios-vip-texto">
            Cashback de<wbr>
            <strong class="beneficios-vip-texto-destaque beneficios-vip-keep">R$&nbsp;1.200</strong><wbr>
            na assinatura<wbr> do ABC Prime
          </p>
        </article>

        <article class="beneficios-vip-card">
          <figure class="beneficios-vip-icone">
            <img src={urlIcone4} alt="Lista de promoções de entrada">
          </figure>
          <p class="beneficios-vip-texto">
            Lista Exclusiva<wbr> de
            <strong class="beneficios-vip-texto-destaque beneficios-vip-keep">20 a 30</strong><wbr>
            promocionais<wbr> de entrada
          </p>
        </article>
      </div>

      <div class="beneficios-vip-acao">
        <a class="lp-cta-premium beneficios-vip-botao" href="#" data-scroll-target="form" onclick={handleScrollToForm}>
          Quero ser cliente VIP
        </a>
      </div>
    </div>
  </section>
</template>
