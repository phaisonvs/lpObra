<template>
  <div class="obra-top-header">
    <div class="obra-full-container-menu">
      <div class="obra-content-menu">
        <div class="obra-menu-logo-wrap">
          <a
            href="#"
            class="obra-menu-logo-link"
            onclick={handleLogoClick}
            aria-label="ABC da Construção — início"
          >
            <img
              src={companyLogoURL}
              alt="ABC da Construção"
              class="obra-menu-logo-img"
              loading="eager"
            />
          </a>
        </div>

        <button
          type="button"
          class="obra-menu-icon"
          onclick={toggleMenu}
          aria-expanded={menuAriaExpanded}
          aria-label={menuButtonLabel}
        >
          <span aria-hidden="true">☰</span>
        </button>

        <nav class={obraNavbarClass} aria-label="Menu da página">
          <a
            class="obra-menu-item"
            href="#"
            data-scroll-target="beneficios"
            onclick={handleMenuNavClick}
          >
            BENEFÍCIOS
          </a>
          <a
            class="obra-menu-item"
            href="#"
            data-scroll-target="hero"
            onclick={handleMenuNavClick}
          >
            COMO FUNCIONA
          </a>
          <a
            class="obra-menu-item"
            href="#"
            data-scroll-target="faq"
            onclick={handleMenuNavClick}
          >
            DÚVIDAS
          </a>
        </nav>

        <div class="obra-menu-cta-slot">
          <a class="obra-menu-cta-btn" href="#" onclick={handleHeaderCtaClick}>
            CADASTRAR OBRA
          </a>
        </div>
      </div>
    </div>
  </div>

  <section class="hero-section" data-lp-section="hero" data-id="hero-section">
    <div class="hero-background">
      <img
        class="hero-background__img"
        src={heroBackgroundSrc}
        alt=""
        aria-hidden="true"
        loading="eager"
        decoding="async"
      />
    </div>

    <div class="hero-container">
      <div class="hero-content">
        <div class="logo-container">
          <img
            src={companyLogoURL}
            alt="Logo ABC da Construção"
            class="logo-abc"
            loading="eager"
          />
        </div>

        <div class="hero-text">
          <p class="subtitulo">
            VOCÊ QUE ESTÁ CONSTRUINDO, REFORMANDO<br />
            OU INVESTINDO NA SUA OBRA,
          </p>
          <h1 class="titulo-principal">
            CADASTRE SUA OBRA<br />
            E ATIVE SEU STATUS VIP
          </h1>
        </div>

        <div class="lp-hero__stats" aria-label="Destaques da marca">
          <article class="lp-hero__stat">
            <div class="lp-hero__stat-icon" aria-hidden="true">
              <img class="lp-hero__stat-icon-img" src={urlHeroStatIconMaiorRede} alt="">
            </div>
            <div class="lp-hero__stat-texto">
              <strong>Maior rede</strong>
              <span>especialista em acabamentos do Brasil</span>
            </div>
          </article>
          <article class="lp-hero__stat">
            <div class="lp-hero__stat-icon" aria-hidden="true">
              <img class="lp-hero__stat-icon-img" src={urlHeroStatIconFranquias} alt="">
            </div>
            <div class="lp-hero__stat-texto">
              <strong>+400</strong>
              <span>franquias</span>
            </div>
          </article>
          <article class="lp-hero__stat">
            <div class="lp-hero__stat-icon" aria-hidden="true">
              <img class="lp-hero__stat-icon-img" src={urlHeroStatIconEstados} alt="">
            </div>
            <div class="lp-hero__stat-texto">
              <strong>11</strong>
              <span>estados do país</span>
            </div>
          </article>
          <article class="lp-hero__stat">
            <div class="lp-hero__stat-icon" aria-hidden="true">
              <img class="lp-hero__stat-icon-img" src={urlHeroStatIconAnos} alt="">
            </div>
            <div class="lp-hero__stat-texto">
              <strong>+68 anos</strong>
              <span>de tradição</span>
            </div>
          </article>
        </div>

        <div class="cta-container">
          <button class="cta-button" onclick={handleCtaClick}>
            <span class="cta-text">
              CADASTRAR OBRA
            </span>
          </button>
          <p class="disclaimer">*Consulte condições</p>
        </div>
      </div>
    </div>

    <button
      type="button"
      class="hero-scroll-hint"
      data-scroll-target="beneficios"
      onclick={handleScrollHintClick}
      aria-label="Ir para benefícios"
    >
      <svg
        class="hero-scroll-hint__icon"
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M7 10l5 5 5-5"
          stroke="currentColor"
          stroke-width="1.85"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </section>

  <section
    class="obra-beneficios"
    data-lp-section="beneficios"
    aria-labelledby="obra-beneficios-titulo"
  >
    <div class="obra-beneficios__inner">
      <header class="obra-beneficios__cabecalho">
        <div class="obra-beneficios__divisor" aria-hidden="true"></div>
        <span class="obra-beneficios__coroa" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 18h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path
              d="m4 18 1.5-9 5 4 2.5-7 2.5 7 5-4L20 18"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <circle cx="6" cy="8.5" r="1.2" fill="currentColor" />
            <circle cx="12.9" cy="4.7" r="1.2" fill="currentColor" />
            <circle cx="18.1" cy="8.4" r="1.2" fill="currentColor" />
          </svg>
        </span>
        <div class="obra-beneficios__divisor" aria-hidden="true"></div>
      </header>

      <h2 id="obra-beneficios-titulo" class="obra-beneficios__titulo">
        Benefícios exclusivos
      </h2>

      <div class="obra-beneficios__grade">
        <article class="obra-beneficios__card">
          <div class="obra-beneficios__icone" aria-hidden="true">
            <img src={urlIcone1} alt="" />
          </div>
          <div class="obra-beneficios__corpo">
            <p class="obra-beneficios__texto">
              Poder de compra da <strong class="obra-beneficios__destaque">Maior Rede</strong> de acabamentos do país
            </p>
          </div>
        </article>

        <article class="obra-beneficios__card">
          <div class="obra-beneficios__icone" aria-hidden="true">
            <img src={urlIcone2} alt="" />
          </div>
          <div class="obra-beneficios__corpo">
            <p class="obra-beneficios__texto">
              Argamassa <strong class="obra-beneficios__destaque">Grátis</strong> para cada 5m² de porcelanatos
            </p>
          </div>
        </article>

        <article class="obra-beneficios__card">
          <div class="obra-beneficios__icone" aria-hidden="true">
            <img src={urlIcone3} alt="" />
          </div>
          <div class="obra-beneficios__corpo">
            <p class="obra-beneficios__texto">
              Cashback de <strong class="obra-beneficios__destaque">R$&nbsp;1.200</strong> na assinatura do ABC Prime
            </p>
          </div>
        </article>

        <article class="obra-beneficios__card">
          <div class="obra-beneficios__icone" aria-hidden="true">
            <img src={urlIcone4} alt="" />
          </div>
          <div class="obra-beneficios__corpo">
            <p class="obra-beneficios__texto">
              Lista exclusiva de <strong class="obra-beneficios__destaque">20 a 30</strong> promocionais de entrada
            </p>
          </div>
        </article>
      </div>

      <div class="obra-beneficios__acao">
        <a
          class="obra-beneficios__cta"
          href="#"
          onclick={handleBeneficiosCtaClick}
        >
          CADASTRAR OBRA
        </a>
      </div>
    </div>
  </section>
</template>
